name: Build Mac DMG

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to build and publish, such as v1.0.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=$(node -p "require('./artifacts/scribe/package.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $version"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app icon
        run: |
          brew install librsvg
          mkdir -p artifacts/scribe/build
          rsvg-convert -w 1024 -h 1024 artifacts/scribe/build/icon.svg -o artifacts/scribe/build/icon.png
          mkdir -p /tmp/Journal.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size artifacts/scribe/build/icon.png --out /tmp/Journal.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) artifacts/scribe/build/icon.png --out /tmp/Journal.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns -o artifacts/scribe/build/icon.icns /tmp/Journal.iconset
          echo "Icon built: $(ls -lh artifacts/scribe/build/icon.icns)"

      - name: Build DMG
        run: pnpm --filter @workspace/scribe run electron:build

      - name: Rename artifacts (strip arch suffix)
        run: |
          cd artifacts/scribe/dist/release
          for f in *-arm64.dmg *-arm64-mac.zip; do
            [ -f "$f" ] && mv "$f" "${f/-arm64/}" && echo "Renamed $f"
          done
          ls -lh

      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Journal-dmg
          path: artifacts/scribe/dist/release/*.dmg
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Journal ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          token: ${{ github.token }}
          files: |
            artifacts/scribe/dist/release/*.dmg
            artifacts/scribe/dist/release/*.zip
