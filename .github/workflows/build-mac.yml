name: Build Mac Installers

on:
  push:
    branches:
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to build and publish, such as v1.0.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.download_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            download_name: Apple-Silicon
          - arch: x64
            runner: macos-15-intel
            download_name: Intel
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${GITHUB_REF_NAME#release/}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=$(node -p "require('./artifacts/scribe/package.json').version")
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $version"
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app icon
        run: |
          brew install librsvg
          mkdir -p artifacts/scribe/build
          rsvg-convert -w 1024 -h 1024 artifacts/scribe/build/icon.svg -o artifacts/scribe/build/icon.png
          mkdir -p /tmp/Journal.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size artifacts/scribe/build/icon.png --out /tmp/Journal.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) artifacts/scribe/build/icon.png --out /tmp/Journal.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns -o artifacts/scribe/build/icon.icns /tmp/Journal.iconset
          echo "Icon built: $(ls -lh artifacts/scribe/build/icon.icns)"

      - name: Build DMG
        run: |
          pnpm --filter @workspace/scribe exec vite build --config vite.electron.config.ts
          pnpm --filter @workspace/scribe exec tsc -p electron/tsconfig.json
          pnpm --filter @workspace/scribe exec electron-builder --mac dmg zip --${{ matrix.arch }} --publish never

      - name: Verify packaged architecture and SQLite
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$EXPECTED_ARCH" in
            arm64) app=artifacts/scribe/dist/release/mac-arm64/Journal.app ;;
            x64) app=artifacts/scribe/dist/release/mac/Journal.app ;;
            *) echo "Unsupported architecture"; exit 1 ;;
          esac
          test -d "$app"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/Journal" -e '
            if (process.arch !== process.env.EXPECTED_ARCH) {
              throw new Error(`Expected ${process.env.EXPECTED_ARCH}, got ${process.arch}`);
            }
            const { createRequire } = require("node:module");
            const appRequire = createRequire(process.argv[1]);
            const Database = appRequire("better-sqlite3");
            const db = new Database(":memory:");
            const result = db.prepare("SELECT 1 AS ok").get();
            if (result.ok !== 1) throw new Error("SQLite smoke test failed");
            db.close();
            console.log(`Packaged ${process.arch} Electron and SQLite verified`);
            process.exit(0);
          ' "$PWD/$app/Contents/Resources/app.asar/package.json"

      - name: Name architecture-specific downloads
        env:
          ARCH: ${{ matrix.arch }}
          DOWNLOAD_NAME: ${{ matrix.download_name }}
        run: |
          set -euo pipefail
          cd artifacts/scribe/dist/release
          mv "Journal-$ARCH.dmg" "Journal-$DOWNLOAD_NAME.dmg"
          mv "Journal-$ARCH.zip" "Journal-$DOWNLOAD_NAME.zip"
          ls -lh

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Journal-${{ matrix.arch }}
          path: |
            artifacts/scribe/dist/release/*.dmg
            artifacts/scribe/dist/release/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish both Mac builds
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download both architectures
        uses: actions/download-artifact@v4
        with:
          pattern: Journal-*
          path: release
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Journal ${{ needs.build.outputs.tag }}
          draft: false
          prerelease: false
          token: ${{ github.token }}
          fail_on_unmatched_files: true
          body: |
            Native Mac downloads for both Apple Silicon (M1 or later) and Intel processors.
            Requires macOS Ventura (13) or newer. Includes the local Whisper runtime compatibility fix.
            Choose the matching DMG installer, or the ZIP alternative.
          files: |
            release/*.dmg
            release/*.zip
